name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tool-tests:
    name: Source inspection tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test source inspection without private downloads
        run: python3 -m unittest discover -s tools/tests -v

  swift-package:
    name: Rendering harness build and tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: swift build --package-path SurabarKit
      - name: Test with synthetic text and system fonts
        run: swift test --package-path SurabarKit

  macos-app:
    name: App build and tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        run: xcodebuild -project Surabar.xcodeproj -scheme Surabar -destination 'platform=macOS' test
