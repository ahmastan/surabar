# XcodeGen specification for the Surabar app. Generate the Xcode project with:
#   xcodegen generate
# Surabar.xcodeproj is generated from this file and is not committed. Regenerate only
# after changing this file; Xcode picks up new and deleted source files by itself.
name: Surabar
options:
  bundleIdPrefix: io.github.ahmastan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc signing: builds run on this Mac without a paid Apple Developer account.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SurabarKit:
    path: SurabarKit
  # Approved dependency: the user-configurable global shortcut that opens Surabar.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  # Approved dependency: signed in-app updates from the GitHub release appcast.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  Surabar:
    type: application
    platform: macOS
    # Synced folders: Xcode picks up added and removed files without regenerating.
    sources:
      - path: Surabar
        type: syncedFolder
    dependencies:
      - package: SurabarKit
        product: MushafRendering
      - package: SurabarKit
        product: QuranStore
      - package: SurabarKit
        product: Recitation
      - package: SurabarKit
        product: Annotations
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Surabar
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ahmastan.surabar
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys, merged into the generated Info.plist.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Surabar
        # The app icon is the Icon Composer file Surabar/AppIcon.icon (Liquid Glass on macOS 26;
        # Xcode also generates the icon for earlier macOS versions).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Menu bar only: no Dock icon or app menu.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 ahmastan and Surabar contributors. MIT License."

  SurabarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SurabarTests
        type: syncedFolder
    dependencies:
      - target: Surabar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ahmastan.surabar.tests

schemes:
  Surabar:
    build:
      targets:
        Surabar: all
        SurabarTests: [test]
    run:
      config: Debug
      environmentVariables:
        # Opens the reader as soon as the app launches from Xcode.
        SURABAR_OPEN_ON_LAUNCH: "1"
    test:
      config: Debug
      targets:
        - SurabarTests
